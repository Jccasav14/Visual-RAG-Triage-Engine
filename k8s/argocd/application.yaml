apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: visual-rag-triage-engine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/user/visual-rag-triage-engine.git'
    targetRevision: qa
    path: k8s/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: visual-rag-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
