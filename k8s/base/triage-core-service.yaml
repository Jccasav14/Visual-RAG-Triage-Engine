apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage-core-service
  template:
    metadata:
      labels:
        app: triage-core-service
    spec:
      containers:
      - name: triage-core-service
        image: visual-rag/triage-core-service:latest
        ports:
        - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: triage-core-service
spec:
  ports:
  - port: 3002
    targetPort: 3002
  selector:
    app: triage-core-service
