apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-orchestrator
  template:
    metadata:
      labels:
        app: llm-orchestrator
    spec:
      containers:
      - name: llm-orchestrator
        image: visual-rag/llm-orchestrator:latest
        ports:
        - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: llm-orchestrator
spec:
  ports:
  - port: 3003
    targetPort: 3003
  selector:
    app: llm-orchestrator
