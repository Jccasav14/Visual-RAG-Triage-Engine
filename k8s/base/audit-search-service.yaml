apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-search-service
  template:
    metadata:
      labels:
        app: audit-search-service
    spec:
      containers:
      - name: audit-search-service
        image: visual-rag/audit-search-service:latest
        ports:
        - containerPort: 3005
---
apiVersion: v1
kind: Service
metadata:
  name: audit-search-service
spec:
  ports:
  - port: 3005
    targetPort: 3005
  selector:
    app: audit-search-service
